# Modified-by: FreeANDIY (Free Andy Agency), 2026. New file, not part of upstream.
# Shared by every FreeANDIY app (source: FreeAndy21/freeandiy); app settings: freeandiy/app.toml.
# Release a FreeANDIY app: build every package with packaging/, check the branding, and attach
# the files to a draft GitHub release (published by hand after a look).
#
# Push a tag `v<version>` (e.g. v0.8.0-fa.1) or run it by hand. Signing secrets are optional:
# without them macOS builds are ad-hoc signed and Windows builds unsigned (the scripts warn).
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD   Developer ID (.p12, base64)
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                           notarization
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD                 Authenticode (.pfx, base64)
# Secrets are read here only, never committed.
name: FreeANDIY release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows_only:
        description: "Only build and check the Windows packages (no release)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TRUNK_VERSION: 0.21.14
  NFPM_VERSION: 2.43.0
  # Upstream's git dependencies are fetched from FreeANDIY mirrors on FreeAndy21 (same commits), so a
  # build never depends on github.com/storytold; any other storytold URL fails the build on purpose.
  # Keep in sync with common/docs/dependencies.md.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: "5"
  GIT_CONFIG_KEY_0: url.https://github.com/FreeAndy21/freeandiy-craft-libs.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/storytold/craft-libs
  GIT_CONFIG_KEY_1: url.https://github.com/FreeAndy21/freeandiy-winprint.insteadOf
  GIT_CONFIG_VALUE_1: https://github.com/storytold/winprint.rs
  GIT_CONFIG_KEY_2: url.https://github.com/FreeAndy21/freeandiy-pdf.insteadOf
  GIT_CONFIG_VALUE_2: https://github.com/storytold/pdfcraft
  GIT_CONFIG_KEY_3: url.https://github.com/FreeAndy21/freeandiy-film.insteadOf
  GIT_CONFIG_VALUE_3: https://github.com/storytold/filmcraft
  GIT_CONFIG_KEY_4: url.https://storytold-is-not-used.invalid/.insteadOf
  GIT_CONFIG_VALUE_4: https://github.com/storytold/

jobs:
  macos:
    if: ${{ !inputs.windows_only }}
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch universal
      - name: Branding check (binaries)
        run: |
          eval "$(freeandiy/scripts/settings.sh | sed 's/^/export /; s/=\(.*\)$/="\1"/')"
          freeandiy/scripts/check-branding.sh $(printf 'target/aarch64-apple-darwin/release/%s ' $FA_EXES)
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/release/*, if-no-files-found: error }

  linux:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on newer distros
    steps:
      - uses: actions/checkout@v4
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev \
            libasound2-dev libudev-dev $(freeandiy/scripts/settings.sh | sed -n 's/^FA_APT=//p') \
            desktop-file-utils appstream zsync
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: packaging/linux/package.sh
      - name: Branding check (binaries)
        run: |
          eval "$(freeandiy/scripts/settings.sh | sed 's/^/export /; s/=\(.*\)$/="\1"/')"
          freeandiy/scripts/check-branding.sh $(printf 'target/release/%s ' $FA_EXES)
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/release/*, if-no-files-found: error }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: packaging/windows/package.ps1 -Arch x64
      - name: Check the MSI installs the notices
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist/release/*.msi | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'msi-admin'
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$out`""
          if ($p.ExitCode -ne 0) { throw "msiexec /a exited with $($p.ExitCode)" }
          foreach ($f in 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'ATTRIBUTION.md', 'LICENSE-FreeANDIY-brand.txt') {
            $hit = Get-ChildItem -Recurse -File -Path $out -Filter $f | Select-Object -First 1
            if (-not $hit) { throw "$f is missing from $($msi.Name)" }
            Write-Host "ok $f -> $($hit.FullName.Substring($out.Length))"
          }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/release/*, if-no-files-found: error }

  web:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk
      - name: Install the wasm-bindgen CLI (apps whose web build calls it directly)
        run: |
          if grep -q 'wasm-bindgen' packaging/web/package.sh; then
            v="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
            curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${v}/wasm-bindgen-${v}-x86_64-unknown-linux-musl.tar.gz" \
              | tar -xz -C "$HOME/.cargo/bin" --strip-components=1 "wasm-bindgen-${v}-x86_64-unknown-linux-musl/wasm-bindgen"
            wasm-bindgen --version
          fi
      - name: Package
        run: |
          eval "$(freeandiy/scripts/settings.sh | sed 's/^/export /; s/=\(.*\)$/="\1"/')"
          env $FA_WEB_ENV packaging/web/package.sh
      - name: Branding check (web build)
        run: freeandiy/scripts/check-branding.sh dist/web
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist/release/*, if-no-files-found: error }

  release:
    needs: [macos, linux, windows, web]
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: App settings
        run: freeandiy/scripts/settings.sh >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with: { path: release-files, merge-multiple: true }
      - name: Checksums
        run: cd release-files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          gh release create "$TAG" release-files/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "$FA_NAME $TAG" \
            --notes "$FA_NAME, based on $FA_UPSTREAM_NAME (MIT/Apache-2.0). See CHANGELOG-FREEANDIY.md."
